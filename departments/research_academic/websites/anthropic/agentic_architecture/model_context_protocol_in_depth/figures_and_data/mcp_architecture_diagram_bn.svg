<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="996" height="616" rx="15" fill="none" stroke="#263554" stroke-width="2"/>

  <!-- Title & Header -->
  <text x="500" y="45" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">
    মডেল কনটেক্সট প্রোটোকল (MCP) এর স্ট্যান্ডার্ড আর্কিটেকচার
  </text>
  <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    অ্যানথ্রপিক ওপেন স্ট্যান্ডার্ড — বাংলা রিসোর্স ফ্যাক্টরি টেকনিক্যাল ভিজ্যুয়ালাইজেশন
  </text>

  <!-- Section 1: MCP Hosts / Applications (Left) -->
  <rect x="50" y="105" width="260" height="470" rx="12" fill="url(#hostGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="105" width="260" height="42" rx="12" fill="#0284c7" opacity="0.2"/>
  <text x="180" y="132" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#7dd3fc">
    ১. MCP Host (হোস্ট প্ল্যাটফর্ম)
  </text>

  <!-- Host Items -->
  <g transform="translate(70, 165)">
    <!-- Item 1 -->
    <rect width="220" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Claude Desktop App</text>
    <text x="110" y="48" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">এনথ্রপিক ইউজার ইন্টারফেস</text>

    <!-- Item 2 -->
    <rect y="80" width="220" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="108" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">OpenCode / IDE</text>
    <text x="110" y="128" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">অ্যাসিস্ট্যান্ট কোডিং এনভায়রনমেন্ট</text>

    <!-- Item 3 -->
    <rect y="160" width="220" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="110" y="188" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Autonomous Agents</text>
    <text x="110" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Paperclip / স্বয়ংক্রিয় এআই টিম</text>

    <!-- Host Internal: MCP Client Box -->
    <rect y="245" width="220" height="135" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="110" y="272" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">MCP Client Engine</text>
    <text x="110" y="295" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• প্রোটোকল হ্যান্ডলার</text>
    <text x="110" y="315" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• সেশন ও পারমিশন কন্ট্রোল</text>
    <text x="110" y="335" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• মেমোরি ও কনটেক্সট বাউন্ডারি</text>
    <text x="110" y="358" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#10b981">দ্বিমুখী JSON-RPC সংযোগকারী</text>
  </g>

  <!-- Section 2: Universal Protocol Bus (Center) -->
  <rect x="360" y="160" width="280" height="360" rx="14" fill="#0f172a" stroke="url(#mcpGrad)" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="360" y="160" width="280" height="42" rx="14" fill="#1e293b"/>
  <text x="500" y="187" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#34d399">
    ২. MCP স্ট্যান্ডার্ড প্রোটোকল লেয়ার
  </text>

  <!-- Protocol Features Inside Center -->
  <g transform="translate(380, 220)">
    <rect width="240" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="120" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">JSON-RPC 2.0 প্রটোকল</text>
    <text x="120" y="38" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">রিকোয়েস্ট, রেসপন্স ও নোটিফিকেশন</text>

    <rect y="60" width="240" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="120" y="82" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">ট্রান্সপোর্ট মেকানিজম</text>
    <text x="120" y="98" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Stdio (লোকাল) | SSE (রিমোট ওয়েব)</text>

    <rect y="120" width="240" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="120" y="142" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f472b6">প্রোটোকল প্রিমাক্সিস (Primitives)</text>
    <text x="120" y="158" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Prompts, Resources ও Tools</text>

    <rect y="180" width="240" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-dasharray="3 3"/>
    <text x="120" y="204" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#10b981">সার্বজনীন USB-C অ্যানালজি</text>
    <text x="120" y="222" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">প্রতিটি টুলের জন্য আলাদা কোড ছাড়াই</text>
    <text x="120" y="234" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">একক স্ট্যান্ডার্ড কানেক্টর</text>
  </g>

  <!-- Section 3: MCP Servers & Data Sources (Right) -->
  <rect x="690" y="105" width="260" height="470" rx="12" fill="url(#serverGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="690" y="105" width="260" height="42" rx="12" fill="#4338ca" opacity="0.3"/>
  <text x="820" y="132" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#c7d2fe">
    ৩. MCP Servers (সার্ভার ও টুলস)
  </text>

  <!-- Server Items -->
  <g transform="translate(710, 165)">
    <!-- Server 1 -->
    <rect width="220" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="25" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">PostgreSQL / SQLite Server</text>
    <text x="110" y="45" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc">ডাটাবেজ স্কিমা ও সরাসরি কোয়েরি</text>

    <!-- Server 2 -->
    <rect y="75" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="100" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Git &amp; GitHub MCP Server</text>
    <text x="110" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc">রিপোজিটরি ফাইল, কমিট ও পিআর হ্যান্ডলিং</text>

    <!-- Server 3 -->
    <rect y="150" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="175" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Local Filesystem Server</text>
    <text x="110" y="195" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc">লোকাল ডিরেক্টরি রিড/রাইট সুরক্ষা</text>

    <!-- Server 4 -->
    <rect y="225" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="250" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Web Search &amp; Browser Server</text>
    <text x="110" y="270" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc">লাইভ ইন্টারনেট তথ্য ও পেজ এক্সপ্লোরেশন</text>

    <!-- Server 5 -->
    <rect y="300" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="110" y="325" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Custom Business Tools</text>
    <text x="110" y="345" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc">এন্টারপ্রাইজ এপিআই ও কাস্টম অটোমেশন</text>
  </g>

  <!-- Connective Arrows -->
  <!-- Left to Center -->
  <path d="M 310 340 L 360 340" stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="335" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7dd3fc">JSON-RPC</text>

  <!-- Center to Right -->
  <path d="M 640 340 L 690 340" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="665" y="330" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a7f3d0">Stdio/SSE</text>

  <!-- Footer Notice -->
  <text x="500" y="595" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
    বাংলা রিসোর্স ফ্যাক্টরি (Bangla Resource Factory) | টেকনিক্যাল এডুকেশন অ্যান্ড আরএন্ডডি ডিভিশন
  </text>
</svg>

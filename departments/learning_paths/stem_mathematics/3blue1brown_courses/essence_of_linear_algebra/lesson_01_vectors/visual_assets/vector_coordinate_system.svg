<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="50" y1="50" x2="550" y2="50"/>
    <line x1="50" y1="110" x2="550" y2="110"/>
    <line x1="50" y1="170" x2="550" y2="170"/>
    <line x1="50" y1="230" x2="550" y2="230"/>
    <line x1="50" y1="290" x2="550" y2="290"/>
    <line x1="50" y1="350" x2="550" y2="350"/>

    <line x1="110" y1="50" x2="110" y2="390"/>
    <line x1="190" y1="50" x2="190" y2="390"/>
    <line x1="270" y1="50" x2="270" y2="390"/>
    <line x1="350" y1="50" x2="350" y2="390"/>
    <line x1="430" y1="50" x2="430" y2="390"/>
    <line x1="510" y1="50" x2="510" y2="390"/>
  </g>

  <!-- Coordinate Axes Origin at (190, 290) -->
  <!-- X Axis -->
  <line x1="70" y1="290" x2="530" y2="290" stroke="#64748b" stroke-width="2.5" marker-end="url(#axis-arrow)"/>
  <!-- Y Axis -->
  <line x1="190" y1="370" x2="190" y2="70" stroke="#64748b" stroke-width="2.5" marker-end="url(#axis-arrow)"/>

  <!-- Axis Labels -->
  <text x="540" y="295" fill="#94a3b8" font-size="14" font-weight="bold">X</text>
  <text x="185" y="58" fill="#94a3b8" font-size="14" font-weight="bold">Y</text>
  <text x="170" y="308" fill="#64748b" font-size="13">(0,0)</text>

  <!-- Step Lines for Vector v = [3, 2] -->
  <!-- Step X: 3 units (3 * 80 = 240px) -> from 190 to 430 -->
  <line x1="190" y1="290" x2="430" y2="290" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="295" y="315" fill="#f59e0b" font-size="13" font-weight="600">x = +3 একক</text>

  <!-- Step Y: 2 units (2 * 60 = 120px) -> from 290 to 170 -->
  <line x1="430" y1="290" x2="430" y2="170" stroke="#10b981" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="440" y="235" fill="#10b981" font-size="13" font-weight="600">y = +2 একক</text>

  <!-- The Vector Arrow -->
  <line x1="190" y1="290" x2="424" y2="174" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Target Point Circle -->
  <circle cx="430" cy="170" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <text x="445" y="165" fill="#f8fafc" font-size="15" font-weight="bold">(3, 2)</text>

  <!-- Title & Vector Notation -->
  <rect x="30" y="15" width="260" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" />
  <text x="45" y="41" fill="#38bdf8" font-size="16" font-weight="bold">ভেক্টর: v⃗ = [ 3 , 2 ]ᵀ</text>
</svg>

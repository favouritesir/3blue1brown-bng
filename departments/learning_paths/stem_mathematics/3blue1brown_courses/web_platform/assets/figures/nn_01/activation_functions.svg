<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#181c2b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" rx="12" fill="url(#actBg)" stroke="#262f45" stroke-width="1.5"/>

  <!-- Left: Sigmoid Function -->
  <g transform="translate(60, 40)">
    <text x="140" y="0" fill="#c084fc" font-family="'Hind Siliguri', sans-serif" font-size="16" text-anchor="middle" font-weight="700">সিগময়েড অ্যাক্টিভেশন: $\sigma(z) = \frac{1}{1 + e^{-z}}$</text>
    
    <!-- Axes -->
    <line x1="20" y1="200" x2="260" y2="200" stroke="#475569" stroke-width="1.5"/>
    <line x1="140" y1="40" x2="140" y2="210" stroke="#475569" stroke-width="1.5"/>

    <!-- Dashed upper and lower asymptotes -->
    <line x1="20" y1="60" x2="260" y2="60" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="10" y="64" fill="#94a3b8" font-family="monospace" font-size="12">1.0</text>
    <text x="10" y="134" fill="#94a3b8" font-family="monospace" font-size="12">0.5</text>
    <text x="10" y="204" fill="#94a3b8" font-family="monospace" font-size="12">0.0</text>
    <line x1="20" y1="130" x2="260" y2="130" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Sigmoid curve -->
    <path d="M 20 198 C 90 198, 120 160, 140 130 C 160 100, 190 62, 260 62" stroke="#a855f7" stroke-width="3.5" fill="none"/>
    <circle cx="140" cy="130" r="4" fill="#f43f5e"/>

    <text x="140" y="235" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="13" text-anchor="middle">ইনপুট $z$ কে ০ থেকে ১ এর মধ্যে স্কোয়াশ (Squash) করে</text>
  </g>

  <!-- Divider -->
  <line x1="400" y1="30" x2="400" y2="290" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Right: ReLU Function -->
  <g transform="translate(460, 40)">
    <text x="140" y="0" fill="#38bdf8" font-family="'Hind Siliguri', sans-serif" font-size="16" text-anchor="middle" font-weight="700">রেলু (ReLU): $\text{ReLU}(z) = \max(0, z)$</text>
    
    <!-- Axes -->
    <line x1="20" y1="200" x2="260" y2="200" stroke="#475569" stroke-width="1.5"/>
    <line x1="140" y1="40" x2="140" y2="210" stroke="#475569" stroke-width="1.5"/>

    <!-- ReLU curve -->
    <line x1="20" y1="200" x2="140" y2="200" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="140" y1="200" x2="250" y2="60" stroke="#38bdf8" stroke-width="3.5"/>
    <circle cx="140" cy="200" r="4" fill="#f43f5e"/>

    <text x="250" y="50" fill="#38bdf8" font-family="monospace" font-size="12">Slope = 1</text>
    <text x="70" y="190" fill="#64748b" font-family="monospace" font-size="12">0 (Flat)</text>

    <text x="140" y="235" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="13" text-anchor="middle">আধুনিক ডিপ লার্নিংয়ের স্ট্যান্ডার্ড — দ্রুত গ্রেডিয়েন্ট প্রবাহ</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <linearGradient id="hierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <filter id="boxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="840" height="260" rx="12" fill="url(#hierBg)" stroke="#262f45" stroke-width="1.5"/>

  <!-- Step 1: Pixels -->
  <g transform="translate(40, 45)">
    <rect width="140" height="150" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="26" fill="#38bdf8" font-family="'Hind Siliguri', sans-serif" font-size="14" text-anchor="middle" font-weight="700">১. পিক্সেল লেয়ার</text>
    <!-- 3x3 pixel grid -->
    <g transform="translate(35, 45)">
      <rect x="0" y="0" width="22" height="22" fill="#1e293b" stroke="#334155"/>
      <rect x="24" y="0" width="22" height="22" fill="#e2e8f0" stroke="#334155"/>
      <rect x="48" y="0" width="22" height="22" fill="#1e293b" stroke="#334155"/>
      <rect x="0" y="24" width="22" height="22" fill="#cbd5e1" stroke="#334155"/>
      <rect x="24" y="24" width="22" height="22" fill="#f8fafc" stroke="#334155"/>
      <rect x="48" y="24" width="22" height="22" fill="#475569" stroke="#334155"/>
      <rect x="0" y="48" width="22" height="22" fill="#1e293b" stroke="#334155"/>
      <rect x="24" y="48" width="22" height="22" fill="#e2e8f0" stroke="#334155"/>
      <rect x="48" y="48" width="22" height="22" fill="#1e293b" stroke="#334155"/>
    </g>
    <text x="70" y="135" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="11" text-anchor="middle">স্বতন্ত্র আলোর তীব্রতা</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 195 120 L 235 120" stroke="#64748b" stroke-width="2"/>
  <polygon points="240,120 232,115 232,125" fill="#64748b"/>

  <!-- Step 2: Edges -->
  <g transform="translate(245, 45)">
    <rect width="140" height="150" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="26" fill="#c084fc" font-family="'Hind Siliguri', sans-serif" font-size="14" text-anchor="middle" font-weight="700">২. কিনারা বা এজ</text>
    <!-- Edges graphics -->
    <g transform="translate(35, 45)">
      <line x1="10" y1="15" x2="60" y2="15" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <line x1="35" y1="25" x2="35" y2="65" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <line x1="15" y1="35" x2="55" y2="65" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="70" y="135" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="11" text-anchor="middle">অনুভূমিক/উল্লম্ব রেখাংশ</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 400 120 L 440 120" stroke="#64748b" stroke-width="2"/>
  <polygon points="445,120 437,115 437,125" fill="#64748b"/>

  <!-- Step 3: Components/Loops -->
  <g transform="translate(450, 45)">
    <rect width="140" height="150" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="70" y="26" fill="#f472b6" font-family="'Hind Siliguri', sans-serif" font-size="14" text-anchor="middle" font-weight="700">৩. লুপ ও প্যাটার্ন</text>
    <!-- Loops / parts -->
    <g transform="translate(35, 45)">
      <circle cx="35" cy="22" r="14" stroke="#f472b6" stroke-width="3" fill="none"/>
      <path d="M 20 48 Q 35 68 50 48" stroke="#f472b6" stroke-width="3" fill="none"/>
    </g>
    <text x="70" y="135" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="11" text-anchor="middle">বৃত্তাকার লুপ বা বক্ররেখা</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 605 120 L 645 120" stroke="#64748b" stroke-width="2"/>
  <polygon points="650,120 642,115 642,125" fill="#64748b"/>

  <!-- Step 4: Full Digits -->
  <g transform="translate(655, 45)">
    <rect width="140" height="150" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2" filter="url(#boxGlow)"/>
    <text x="70" y="26" fill="#34d399" font-family="'Hind Siliguri', sans-serif" font-size="14" text-anchor="middle" font-weight="700">৪. সম্পূর্ণ ডিজিট</text>
    <g transform="translate(45, 42)">
      <text x="25" y="48" fill="#34d399" font-family="'Hind Siliguri', sans-serif" font-size="44" font-weight="800" text-anchor="middle">৮</text>
    </g>
    <text x="70" y="135" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="11" text-anchor="middle">চূড়ান্ত সিদ্ধান্ত: ডিজিট ৮</text>
  </g>

  <text x="420" y="235" fill="#cbd5e1" font-family="'Hind Siliguri', sans-serif" font-size="13" text-anchor="middle">ডিপ লার্নিংয়ের মূল দর্শন: সহজ উপাদান থেকে ধাপে ধাপে জটিল ধারণার স্তরভিত্তিক বিন্যাস</text>
</svg>
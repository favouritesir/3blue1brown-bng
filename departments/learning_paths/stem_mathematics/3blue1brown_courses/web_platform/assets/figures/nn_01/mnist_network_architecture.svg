<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#141724"/>
    </linearGradient>
    <filter id="netGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="14" fill="url(#netBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: 28x28 Handwritten image representation -->
  <g transform="translate(40, 90)">
    <rect width="110" height="110" rx="8" fill="#030712" stroke="#38bdf8" stroke-width="2"/>
    <text x="55" y="-14" fill="#94a3b8" font-family="'Hind Siliguri', sans-serif" font-size="13" text-anchor="middle" font-weight="600">ইনপুট ইমেজ</text>
    <text x="55" y="132" fill="#38bdf8" font-family="'Hind Siliguri', sans-serif" font-size="12" text-anchor="middle">২৮ × ২৮ = ৭৮৪ পিক্সেল</text>
    <!-- Handwritten '7' inside -->
    <path d="M 25 32 L 85 32 L 50 92" stroke="#f8fafc" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 38 60 L 68 60" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Arrow from image to Input Layer -->
  <path d="M 160 145 L 210 145" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="215,145 205,139 205,151" fill="#38bdf8"/>

  <!-- Layer 1: Input Neurons (784) -->
  <g transform="translate(250, 40)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Hind Siliguri', sans-serif" font-size="15" text-anchor="middle" font-weight="700">ইনপুট লেয়ার</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">(৭৮৪টি নিউরন)</text>

    <!-- Node stack -->
    <circle cx="0" cy="55" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="85" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="115" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="145" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="175" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Dots -->
    <circle cx="0" cy="205" r="3" fill="#64748b"/>
    <circle cx="0" cy="220" r="3" fill="#64748b"/>
    <circle cx="0" cy="235" r="3" fill="#64748b"/>
    <circle cx="0" cy="265" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="295" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="325" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Dense connections Layer 1 -> Layer 2 -->
  <g stroke="rgba(168, 85, 247, 0.15)" stroke-width="1">
    <line x1="250" y1="95" x2="430" y2="125"/>
    <line x1="250" y1="95" x2="430" y2="165"/>
    <line x1="250" y1="95" x2="430" y2="205"/>
    <line x1="250" y1="125" x2="430" y2="125"/>
    <line x1="250" y1="125" x2="430" y2="245"/>
    <line x1="250" y1="155" x2="430" y2="165"/>
    <line x1="250" y1="305" x2="430" y2="285"/>
    <line x1="250" y1="335" x2="430" y2="325"/>
    <line x1="250" y1="365" x2="430" y2="245"/>
    <line x1="250" y1="185" x2="430" y2="205" stroke="rgba(192, 132, 252, 0.7)" stroke-width="2"/>
    <line x1="250" y1="125" x2="430" y2="205" stroke="rgba(192, 132, 252, 0.7)" stroke-width="2"/>
    <line x1="250" y1="305" x2="430" y2="205" stroke="rgba(192, 132, 252, 0.7)" stroke-width="2"/>
  </g>

  <!-- Layer 2: Hidden Layer 1 (16) -->
  <g transform="translate(430, 40)">
    <text x="0" y="0" fill="#c084fc" font-family="'Hind Siliguri', sans-serif" font-size="15" text-anchor="middle" font-weight="700">হিডেন লেয়ার ১</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">(১৬টি নিউরন)</text>

    <circle cx="0" cy="65" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="100" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="135" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="170" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="205" r="12" fill="#a855f7" stroke="#f3e8ff" stroke-width="2.5" filter="url(#netGlow)"/>
    <circle cx="0" cy="240" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="275" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
    <circle cx="0" cy="310" r="10" fill="#6b21a8" stroke="#c084fc" stroke-width="1.8"/>
  </g>

  <!-- Connections Layer 2 -> Layer 3 -->
  <g stroke="rgba(192, 132, 252, 0.2)" stroke-width="1">
    <line x1="430" y1="105" x2="610" y2="105"/>
    <line x1="430" y1="105" x2="610" y2="175"/>
    <line x1="430" y1="245" x2="610" y2="210" stroke="rgba(244, 114, 182, 0.7)" stroke-width="2"/>
    <line x1="430" y1="245" x2="610" y2="280" stroke="rgba(244, 114, 182, 0.7)" stroke-width="2"/>
    <line x1="430" y1="315" x2="610" y2="315"/>
  </g>

  <!-- Layer 3: Hidden Layer 2 (16) -->
  <g transform="translate(610, 40)">
    <text x="0" y="0" fill="#f472b6" font-family="'Hind Siliguri', sans-serif" font-size="15" text-anchor="middle" font-weight="700">হিডেন লেয়ার ২</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">(১৬টি নিউরন)</text>

    <circle cx="0" cy="65" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="100" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="135" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="170" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="205" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="240" r="12" fill="#ec4899" stroke="#fdf2f8" stroke-width="2.5" filter="url(#netGlow)"/>
    <circle cx="0" cy="275" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="0" cy="310" r="10" fill="#831843" stroke="#f472b6" stroke-width="1.8"/>
  </g>

  <!-- Connections Layer 3 -> Output Layer -->
  <g stroke="rgba(244, 114, 182, 0.2)" stroke-width="1">
    <line x1="610" y1="280" x2="790" y2="295" stroke="#38bdf8" stroke-width="3" filter="url(#netGlow)"/>
    <line x1="610" y1="245" x2="790" y2="295" stroke="#38bdf8" stroke-width="2"/>
    <line x1="610" y1="105" x2="790" y2="75"/>
    <line x1="610" y1="315" x2="790" y2="365"/>
  </g>

  <!-- Output Layer: 10 Digits (0 to 9) -->
  <g transform="translate(790, 40)">
    <text x="0" y="0" fill="#38bdf8" font-family="'Hind Siliguri', sans-serif" font-size="15" text-anchor="middle" font-weight="700">আউটপুট লেয়ার</text>
    <text x="0" y="20" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">(১০টি ডিজিট)</text>

    <!-- 0 to 9 -->
    <circle cx="0" cy="45" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="50" fill="#94a3b8" font-family="monospace" font-size="13">০ [0.01]</text>
    <circle cx="0" cy="77" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="82" fill="#94a3b8" font-family="monospace" font-size="13">১ [0.03]</text>
    <circle cx="0" cy="109" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="114" fill="#94a3b8" font-family="monospace" font-size="13">২ [0.00]</text>
    <circle cx="0" cy="141" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="146" fill="#94a3b8" font-family="monospace" font-size="13">৩ [0.02]</text>
    <circle cx="0" cy="173" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="178" fill="#94a3b8" font-family="monospace" font-size="13">৪ [0.01]</text>
    <circle cx="0" cy="205" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="210" fill="#94a3b8" font-family="monospace" font-size="13">৫ [0.00]</text>
    <circle cx="0" cy="237" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="242" fill="#94a3b8" font-family="monospace" font-size="13">৬ [0.01]</text>
    <!-- 7 is activated! -->
    <circle cx="0" cy="269" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#netGlow)"/><text x="26" y="274" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">৭ [0.94] ★</text>
    <circle cx="0" cy="301" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="306" fill="#94a3b8" font-family="monospace" font-size="13">৮ [0.02]</text>
    <circle cx="0" cy="333" r="11" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="24" y="338" fill="#94a3b8" font-family="monospace" font-size="13">৯ [0.04]</text>
  </g>
</svg>
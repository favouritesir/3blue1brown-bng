            - generic [ref=e2441] [box=177,22396,760,50]: এই অ্যানিমেশনে পুরো সমতল ৯০ ডিগ্রি ঘড়ির কাঁটার বিপরীত দিকে ঘুরছে। আই হ্যাট উপরের দিকে এবং জে হ্যাট বামদিকে নতুন অবস্থান নিচ্ছে—এই দুটিই ম্যাট্রিক্সের দুটি কলাম। গ্রিডের প্রতিটি বর্গক্ষেত্র একই কোণে ঘুরলেও তার আকার ও ক্ষেত্রফল অপরিবর্তিত থাকে।
          - figure "চিত্রে ৯০° ঘূর্ণনের ম্যাট্রিক্সের কলাম দুটি আলাদা করে দেখা হয়েছে—প্রথম কলাম [0, 1] আই হ্যাটের নতুন ঠিকানা, দ্বিতীয় কলাম [−1, 0] জে হ্যাটের। দুটি কলাম পরস্পরের ওপর লম্ব, তাই কোনো সংকোচন ঘটে না। এই ম্যাট্রিক্সটিকে যেকোনো ভেক্টরের সাথে গুণ করলেই সেটি ৯০° ঘুরে যায়। কলাম দুটির অবস্থান থেকেই পুরো ঘূর্ণনটি পুনর্গঠন করা যায়।" [ref=e2443] [box=31,22477,1052,418]:

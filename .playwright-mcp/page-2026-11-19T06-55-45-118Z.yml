            - button "🔊 শিক্ষক অডিও শুনুন" [ref=e1401] [cursor=pointer] [box=926,16998,157,32]
          - figure "একটি রূপান্তরকে সংখ্যায় বর্ণনা করার প্রথম প্রশ্ন হলো—আমি কী দিয়ে শুরু করব? এই চিত্রে দেখানো হয়েছে যে ভিত্তি ভেক্টর দুটির গন্তব্য রেকর্ড করাই যথেষ্ট। একবার সেই দুটি তথ্য থাকলে বাকি সব ভেক্টরের গন্তব্য হিসাব করা যায়। এটি পুরো অধ্যায়ের কেন্দ্রীয় কৌশল।" [ref=e1405] [box=31,17092,1052,418]:
            - img "রূপান্তর কীভাবে বর্ণনা করবেন" [ref=e1406] [box=237,17092,640,360]
          - figure "এই চিত্রে রৈখিক রূপান্তর বোঝার মূল কৌশলটি ধাপে ধাপে দেখা যায়—প্রথমে ভিত্তি ভেক্টর চিহ্নিত করুন, এরপর তাদের রূপান্তরিত অবস্থান আবিষ্কার করুন। যেকোনো ভেক্টরের ক্ষেত্রে একই নিয়ম প্রয়োগ করা যায়। এই পদ্ধতি ভিডিও না দেখেই ফলাফল বলার ক্ষমতা দেয়। এটি ম্যাট্রিক্স গুণনের জ্যামিতিক ভিত্তি গড়ে তোলে।" [ref=e1409] [box=31,17542,1052,419]:
            - img "ভিত্তি ভেক্টর ট্র্যাকিং কৌশল" [ref=e1410] [box=237,17542,640,360]
          - figure "দুটি কলাম ভেক্টরকে পাশাপাশি বসিয়ে একটি ২×২ ম্যাট্রিক্স গঠন দেখানো হয়েছে। প্রতিটি কলাম একটি ভিত্তি ভেক্টরের রূপান্তরিত স্থানাঙ্ক ধারণ করে। কলামের ক্রম অত্যন্ত গুরুত্বপূর্ণ—প্রথম কলাম সবসময় আই হ্যাটের জন্য সংরক্ষিত। এই সুশৃঙ্খল বিন্যাসই ম্যাট্রিক্সকে একটি শক্তিশালী ভাষা করে তোলে।" [ref=e1413] [box=31,17993,1052,420]:
            - img "২×২ ম্যাট্রিক্স নোটেশন" [ref=e1414] [box=237,17993,640,361]
          - figure "এই চিত্রে ইনপুট ভেক্টর, ম্যাট্রিক্স এবং আউটপুট ভেক্টর—তিনটি উপাদান একসাথে দেখা যায়। ম্যাট্রিক্সটিকে একটি 'যন্ত্র' হিসেবে ভাবুন যা ইনপুট নিয়ে আউটপুট তৈরি করে। ভিত্তি ভেক্টরের কলাম দুটি সেই যন্ত্রের অভ্যন্তরীণ নিয়ম নির্ধারণ করে। এই চিত্রটি ম্যাট্রিক্স-ভেক্টর গুণনের পুরো প্রক্রিয়াটি একফ্রেমে ধরে রাখে।" [ref=e1417] [box=31,18444,1052,419]:

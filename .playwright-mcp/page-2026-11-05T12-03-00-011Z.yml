          - text: দুটি ভেক্টর যোগ করার জ্যামিতিক পদ্ধতিটি অত্যন্ত স্বাভাবিক ও স্বজ্ঞাত। একে বলা হয়
          - emphasis [ref=f18e572] [box=633,9087,210,27]: টিপ-টু-টেইল (Tip-to-Tail) পদ্ধতি
          - text: । প্রথম ভেক্টরের মাথায় দ্বিতীয় ভেক্টরের লেজ স্থাপন করুন। এরপর প্রথম ভেক্টরের সূচনা থেকে দ্বিতীয় ভেক্টরের শীর্ষবিন্দু পর্যন্ত টানা নতুন ভেক্টরটিই হলো তাদের যোগফল।

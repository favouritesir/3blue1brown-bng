        - paragraph [ref=f23e595] [box=112,9624,1052,96]:
          - text: ত্রিমাত্রিক বা থ্রিডি স্পেসের ক্ষেত্রে আমরা তৃতীয় একটি অক্ষ যোগ করি যার নাম
          - emphasis [ref=f23e596] [box=598,9626,67,27]: জেড অক্ষ
          - text: ", যা এক্স এবং ওয়াই উভয় অক্ষের সাথেই সমকোণে অবস্থান করে। এই ক্ষেত্রে প্রতিটি ভেক্টর তিনটি সংখ্যার একটি সুশৃঙ্খল ট্রিপলেট (ordered triplet)-এর সাথে সম্পর্কিত: প্রথম সংখ্যাটি নির্দেশ করে এক্স অক্ষ বরাবর কত দূর যেতে হবে, দ্বিতীয়টি ওয়াই অক্ষের সমান্তরালে কত দূর, এবং তৃতীয়টি নতুন জেড অক্ষের সমান্তরালে কত দূর সরণ নির্দেশ করে।"

        - paragraph [ref=f23e2342] [box=112,17813,1052,96]:
          - text: "পরবর্তী ভিডিওগুলোতে আপনারা আরও স্পষ্ট বুঝতে পারবেন কেন আমি বলেছিলাম—লিনিয়ার বীজগণিতের প্রতিটি বিষয় মূলত দুটি মৌলিক ক্রিয়াকলাপের চারপাশে ঘোরে:"
          - strong [ref=f23e2343] [box=112,17847,73,27]: ভেক্টর যোগ
          - text: এবং
          - strong [ref=f23e2344] [box=219,17847,82,27]: স্কেলার গুণন
          - text: । আর এই সিরিজের শেষ পর্বে আমি আরও বিস্তারিত বলব গণিতবিদরা কীভাবে এবং কেন কেবল এই অপারেশনগুলো নিয়েই ভাবেন, ভেক্টরকে আপনি যেভাবেই প্রকাশ করুন না কেন, তার রূপভেদ থেকে সম্পূর্ণ স্বাধীন ও বিমূর্তভাবে।
        - paragraph [ref=f23e2345] [box=112,17929,1052,128]: সত্যি বলতে, ভেক্টরকে আপনি মহাশূন্যের তীরচিহ্ন ভাবছেন যার একটি চমৎকার সংখ্যাতাত্ত্বিক রূপ আছে—যেমনটা আমি পরামর্শ দিচ্ছি, নাকি সংখ্যার তালিকা ভাবছেন যার একটি চমৎকার জ্যামিতিক রূপ আছে—তাতে আসলে কোনো তফাত পড়ে না। লিনিয়ার বীজগণিতের আসল কার্যকারিতা কেবল একটি দৃষ্টিভঙ্গিতে সীমাবদ্ধ নয়; বরং এই দুই রূপের মাঝে অবলীলায় রূপান্তর ও আদান-প্রদান করতে পারার দক্ষতাই এর মূল শক্তি। এটি একজন ডেটা অ্যানালিস্টকে বিশাল সংখ্যার তালিকাকে চোখের সামনে ভিজ্যুয়ালাইজ করার অনন্য সুযোগ দেয়, যা ডেটার মধ্যকার লুকানো প্যাটার্ন স্পষ্ট করতে এবং বিভিন্ন গাণিতিক অপারেশনের সামগ্রিক প্রভাব বুঝতে দারুণ সাহায্য করে।
        - paragraph [ref=f23e2346] [box=112,18076,1052,128]: অন্যদিকে, পদার্থবিদ ও কম্পিউটার গ্রাফিক্স প্রোগ্রামারদের এটি একটি শক্তিশালী ভাষা দেয়, যার মাধ্যমে স্পেস এবং তার বিভিন্ন পরিবর্তনকে কম্পিউটারে গণনাকৃত সংখ্যার মাধ্যমে নিখুঁতভাবে পরিচালনা করা সম্ভব হয়। উদাহরণস্বরূপ, আমি যখন এই গাণিতিক অ্যানিমেশনগুলো তৈরি করি, আমি প্রথমে চিন্তা করি স্পেসের মাঝে জ্যামিতিকভাবে ঠিক কী ঘটছে; তারপর কম্পিউটারকে দিয়ে তা সংখ্যায় রূপান্তর করাই, যাতে কম্পিউটার স্ক্রিনের ঠিক কোন পিক্সেলটি কোথায় জ্বলবে তা সঠিকভাবে বের করতে পারে। আর এটি নিখুঁতভাবে করার জন্য লিনিয়ার বীজগণিতের গভীর বোঝাপড়ার ওপর ভরসা করতে হয়।

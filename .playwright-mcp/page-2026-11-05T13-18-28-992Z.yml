          - paragraph [ref=f8e1395] [box=112,15477,1052,96]: "এখন যদি আমরা এর সাথে একটি তৃতীয় ভেক্টর যুক্ত করি, এবং তিনটি ভেক্টরের সম্মিলিত স্প্যান বিবেচনা করি, তবে কী ঘটবে? তিনটি ভেক্টরের রৈখিক সমন্বয় দুটি ভেক্টরের মতোই সংজ্ঞায়িত: তিনটি স্কেলার বেছে নিন, সেগুলো দিয়ে প্রতিটি ভেক্টরকে স্কেল করুন, তারপর তাদের যোগ করুন। আর পুনরায়, এদের স্প্যান হলো সম্ভাব্য সব রৈখিক সমন্বয়ের সেট।"

          - paragraph [ref=f8e1330] [box=112,10881,1052,64]: মানুষ কীভাবে সাধারণত ভেক্টরকে বিন্দু হিসেবে চিন্তা করে, তা নিয়ে কথা বলার জন্য এটি একটি উপযুক্ত সময়। একটি সরলরেখার ওপর রাখা ভেক্টরের বিশাল সংগ্রহ নিয়ে ভাবাটা ভীষণ ঘিঞ্জি ও জটিল মনে হয়; আর সমতল পূর্ণ করে ফেলা সমস্ত দ্বিমাত্রিক ভেক্টরকে একসাথে ভাবতে গেলে পরিস্থিতি আরও বেশি জটিল ও বিশৃঙ্খল হয়ে ওঠে।

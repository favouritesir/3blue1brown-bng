          - paragraph [ref=f8e726] [box=112,7909,1052,96]: সুতরাং দুটি ভেক্টরের রৈখিক সমন্বয় মূলত এই দুটি অসীম রেখাকে একত্রিত করার একটি পদ্ধতি। বেশিরভাগ ভেক্টর জোড়ার ক্ষেত্রে, আপনি যদি উভয় স্কেলারকে মুক্তভাবে বিচরণ করতে দেন এবং সম্ভাব্য প্রতিটি ভেক্টর বিবেচনা করেন, তবে আপনি সমতলের প্রতিটি সম্ভাব্য বিন্দুতে পৌঁছাতে সক্ষম হবেন। প্রতিটি দ্বিমাত্রিক ভেক্টরই তখন আপনার নাগালের মধ্যে চলে আসবে।

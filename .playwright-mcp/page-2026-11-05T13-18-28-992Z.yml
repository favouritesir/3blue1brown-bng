          - paragraph [ref=f8e1343] [box=112,11490,1052,64]: তাই যখন ভেক্টরের এই ধরনের সংগ্রহ নিয়ে কাজ করা হয়, তখন স্থানটিতে প্রতিটি ভেক্টরকে কেবল তার শীর্ষবিন্দু (tip) দ্বারা একটি বিন্দু হিসেবে উপস্থাপন করাটা প্রচলিত নিয়ম। এভাবে আপনি যদি কোনো নির্দিষ্ট সরলরেখার ওপর শীর্ষবিন্দু থাকা প্রতিটি সম্ভাব্য ভেক্টর নিয়ে ভাবতে চান, তবে আপনাকে শুধু সেই রেখাটি নিয়ে ভাবলেই চলে।
